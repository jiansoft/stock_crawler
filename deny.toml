[graph]
targets = []

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "workspace"
yanked = "warn"
# zip 8.x 的解壓漏洞（2026-10-17 公告，修正版為 9.0.0）：zip 只是 utoipa-swagger-ui 10.0.1（目前最新）的
# build-dependency，且版本需求寫死 "8.6"，無法單獨升級。它的 build.rs 只在編譯時解壓寫死版本的官方
# Swagger UI 封包，逐檔以 by_index + enclosed_name() 寫出，沒有呼叫公告中有問題的
# ZipArchive::extract／ZipStreamReader::extract；執行期不含 zip。utoipa-swagger-ui 改用 zip 9 後移除。
ignore = [
    { id = "RUSTSEC-2026-0367", reason = "zip 只是 utoipa-swagger-ui 的 build-dependency，解壓固定版本的 Swagger UI 封包，不用 extract()" },
    { id = "RUSTSEC-2026-0368", reason = "同上：build.rs 不呼叫 ZipArchive::extract" },
    { id = "RUSTSEC-2026-0369", reason = "同上：build.rs 不呼叫 ZipArchive::extract／ZipStreamReader::extract" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "CDLA-Permissive-2.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
