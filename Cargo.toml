[package]
name = "stock_crawler"
version = "0.1.0"
edition = "2024"
authors = ["Eddie <eddiea.chen@gmail.com>"]
license = "MIT"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.rust]
# 【保母級說明：關於連結器警告過濾】
# Rust 1.97.0 新版編譯器預設會將底層連結器（Linker）的警告輸出至終端機（受 linker_messages 控制）。
# 在 Windows 環境下使用 MSVC 連結器進行 release 優化編譯時，會因為傳遞舊版參數而輸出無害的：
#   "warning: linker stderr: ignoring deprecated linker optimization setting '1'"
# 將 linker_messages 設為 "allow" 可以過濾此類無害的警告，保持編譯日誌的乾淨整潔。
linker_messages = "allow"


[dependencies]
#rocket = "0.5.0-rc.3"
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
concat-string = "1.0.1"
config = "0.15"
#crossbeam = "0.8"
#crossbeam-channel = "0.5"
deadpool-redis = "0.23"
#digest = "0.10"
dotenvy = "0.15"
encoding_rs = "0.8"
futures ="0.3"
hashbrown = "0.17"
#hex = "0.4"
#lazy_static = "1.5"
#log = { version = "^0.4", features = ["std"] }
num_cpus = "1.17"
once_cell = "1.21"
#parking_lot = "0.12"
#openssl = { version = "0.10", features = ["vendored"] }
prost = "0.14"
rand = "0.10"
tonic-prost = "0.14"
rayon = "1.12"
#redis = { version = "0.28", features = ["tokio-comp"]  }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "charset", "json", "form", "brotli", "gzip", "cookies", "zstd", "http2"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-pki-types = { version = "1.15", features = ["alloc", "std"] }
rust_decimal = "1.42"
rust_decimal_macros = "1.40"
scraper = "0.27"
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
#sha2 = { version = "0.11", features = [] }
sqlx = { version = "0.9", features = [ "runtime-tokio", "postgres", "time", "chrono", "bigdecimal", "macros", "rust_decimal"] }
strum = { version = "0.28", features = ["derive"]}
strum_macros = "0.28"
tokio = { version = "1.52", features = ["full"] }
tokio-cron-scheduler = "0.15"
tokio-retry = "0.3"
tokio-stream = "0.1"
#tokio-test = "0.4"
tonic = { version = "0.14", features = ["transport", "channel", "tls-ring", "gzip"] }
moka = { version = "0.12.15", features = ["sync"] }
urlencoding = "2.1"
lazy_static = "1.5"
scopeguard = "1.2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.18"
#time = "=0.3.49"

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc = "0.1"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

# 【保母級說明：關於基準測試 (Benchmark)】
# 這裡定義了專案中的基準/效能測試目標。每個 [[bench]] 都會在 `benches/` 目錄下尋找同名的 `.rs` 檔案。
# 設定 `harness = false` 是為了禁用 Rust 標準庫預設的測試框架，轉而使用更精準的第三方效能測試工具 `criterion`（宣告於 [dev-dependencies]）。
# 執行所有基準測試指令為：`cargo bench`
# 執行單一基準測試指令為：`cargo bench --bench <name>`

[[bench]]
# 測試 TWSE 行情解析效能，對應 benches/twse_quote_parser.rs
name = "twse_quote_parser"
harness = false

[[bench]]
# 測試每日行情轉換與處理效能，對應 benches/daily_quote_mapper.rs
name = "daily_quote_mapper"
harness = false

[[bench]]
# 測試快取快照查詢與過濾效能，對應 benches/cache_snapshot_lookup.rs
name = "cache_snapshot_lookup"
harness = false

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"
