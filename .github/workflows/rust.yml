name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
    - uses: actions/checkout@v7
    - name: Dependency review
      uses: actions/dependency-review-action@v5
      with:
        # 只擋 high/critical 的 GHSA 漏洞；low/moderate 的逐級把關交給 cargo-deny
        # (RustSec) 那個 job。否則 GHSA 每日更新的 low-severity 公告(例如
        # rand 0.8.5 的 unsound 邊角案例)會在不相關的 PR 上反覆觸發失敗。
        fail-on-severity: high

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.95.0
        components: rustfmt
    - name: Check formatting
      run: cargo fmt --all -- --check

  check:
    name: Check & Clippy (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    strategy:
      # fail-fast 設 false：兩條 toolchain 各自跑完、各自回報。
      # 若設 true（預設），MSRV 一失敗就會取消 stable 那條，
      # 反而看不出「是只有舊編譯器壞，還是新舊都壞」。
      fail-fast: false
      matrix:
        # 同一套檢查跑兩個編譯器版本：
        # - 1.95.0（MSRV）：驗證 Cargo.toml 宣告的 rust-version 是真的可編譯，
        #   而不是只寫在 manifest 裡的裝飾品。
        # - stable（最新穩定版）：提早發現新版編譯器/新 lint 造成的破壞，
        #   不必等到日後升級 MSRV 時才一次爆出來。
        toolchain: ["1.95.0", "stable"]
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ matrix.toolchain }}
        components: clippy
    - name: Rust cache
      uses: Swatinem/rust-cache@v2
      with:
        # cache key 納入 toolchain 版本，避免 MSRV 與 stable 互相覆蓋彼此的
        # 編譯快取（兩者產物不相容，混用只會一直 cache miss）。
        key: ${{ matrix.toolchain }}

    - name: Cargo check
      # --locked：要求 Cargo.lock 與 Cargo.toml 一致；若 lock 過期則明確報錯，
      # 而非默默重新解析相依（避免 transitive 套件浮到不相容新版本造成編譯失敗）。
      run: cargo check --locked --verbose
    - name: Clippy
      # --all-targets：連同 tests、benches、examples 一起 lint，
      #   不然測試碼的警告要等本機開發者自己跑才會發現。
      # --all-features：把所有 feature 打開檢查（含 integration-tests 等
      #   測試用 feature），避免被 feature gate 藏住的程式碼腐化。
      # -D warnings：把警告升級成錯誤——CI 的警告沒人會回頭看，
      #   不擋下來等於沒檢查。
      run: cargo clippy --all-targets --all-features --locked -- -D warnings

  proto-lint:
    name: Proto Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v7
    - uses: bufbuild/buf-action@v1
      with:
        input: etc/proto
        lint: true
        format: false
        breaking: false
        push: false

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check advisories licenses bans

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [fmt, check, deny]
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.95.0
    - name: Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Build
      # --locked 理由同 check job：鎖定相依版本，確保 CI 編譯的東西
      # 與開發者本機、與最終部署的是同一組套件。
      run: cargo build --locked --verbose

  # 單元測試 job：不掛任何 service container。
  #
  # 需要 PostgreSQL/Redis 的測試都標了
  # `#[cfg_attr(not(feature = "integration-tests"), ignore = "...")]`，
  # 預設（不開 feature）會被視為 ignored——所以這個 job 只跑純函式與
  # 記憶體內邏輯的測試，幾十秒內完成，讓每個 PR 都能快速得到第一層回饋。
  # 完整的 DB/Redis 驗證交給下面的 integration test job。
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    needs: [build]
    # 保險絲：正常執行約 4 分鐘。若測試卡死（例如連線池跨 runtime 問題），
    # 15 分鐘就讓 job 失敗，不要吃滿 GitHub 預設的 6 小時上限。
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.95.0
    - name: Rust cache
      uses: Swatinem/rust-cache@v2

    - name: Run unit tests
      # 不開 integration-tests feature：DB/Redis 測試自動 ignored。
      # 仍用 --test-threads=1，因為部分測試共享全域狀態（cache、event dispatcher）。
      run: cargo test --locked -- --test-threads=1
      env:
        RUST_BACKTRACE: 1

  test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [build]
    # 保險絲：正常執行約 10 分鐘（含編譯與 DB 種子）。若測試卡死，
    # 30 分鐘就讓 job 失敗，不要吃滿 GitHub 預設的 6 小時上限。
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
    - uses: actions/checkout@v7

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.95.0
        components: rustfmt, clippy
    - name: Rust cache
      uses: Swatinem/rust-cache@v2
    - name: Install PostgresSQL client
      run: sudo apt-get -yqq install postgresql-client

    - name: Run SQL file
      run: |
        export PGPASSWORD=password
        psql -h localhost -U user -d db -a -f etc/sql/config.sql
        psql -h localhost -U user -d db -a -f etc/sql/corporate_action.sql
        psql -h localhost -U user -d db -a -f etc/sql/daily_money_history.sql
        psql -h localhost -U user -d db -a -f etc/sql/daily_money_history_member.sql
        psql -h localhost -U user -d db -a -f etc/sql/daily_money_history_detail.sql
        psql -h localhost -U user -d db -a -f etc/sql/daily_money_history_detail_more.sql
        psql -h localhost -U user -d db -a -f etc/sql/daily_quote.sql
        psql -h localhost -U user -d db -a -f etc/sql/daily_stock_price_stats.sql
        psql -h localhost -U user -d db -a -f etc/sql/dividend.sql
        psql -h localhost -U user -d db -a -f etc/sql/dividend_record_detail.sql
        psql -h localhost -U user -d db -a -f etc/sql/dividend_record_detail_more.sql
        psql -h localhost -U user -d db -a -f etc/sql/estimate.sql
        psql -h localhost -U user -d db -a -f etc/sql/financial_statement.sql
        psql -h localhost -U user -d db -a -f etc/sql/index.sql
        psql -h localhost -U user -d db -a -f etc/sql/last_daily_quotes.sql
        psql -h localhost -U user -d db -a -f etc/sql/quote_history_record.sql
        psql -h localhost -U user -d db -a -f etc/sql/revenue.sql
        psql -h localhost -U user -d db -a -f etc/sql/revenue_last_date.sql
        psql -h localhost -U user -d db -a -f etc/sql/stock_cagr.sql
        psql -h localhost -U user -d db -a -f etc/sql/stock_exchange_market.sql
        psql -h localhost -U user -d db -a -f etc/sql/stock_industry.sql
        psql -h localhost -U user -d db -a -f etc/sql/stock_ownership_details.sql
        psql -h localhost -U user -d db -a -f etc/sql/stocks.sql
        psql -h localhost -U user -d db -a -f etc/sql/stock_word.sql
        psql -h localhost -U user -d db -a -f etc/sql/stock_index.sql
        psql -h localhost -U user -d db -a -f etc/sql/trace.sql
        psql -h localhost -U user -d db -a -f etc/sql/yield_rank.sql

    - name: Run tests
      # --features integration-tests：明確開啟整合測試（DB/Redis 測試不再 ignored），
      # 搭配上方 service container 提供的 PostgreSQL/Redis 執行完整驗證。
      run: cargo test --release --locked --features integration-tests -- --nocapture --test-threads=1
      env:
        RUST_BACKTRACE: 1
        DATABASE_URL: postgres://user:password@localhost:5432/db
        POSTGRESQL_HOST: localhost
        POSTGRESQL_PORT: 5432
        POSTGRESQL_USER: user
        POSTGRESQL_PASSWORD: password
        POSTGRESQL_DB: db

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: db
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis
        ports:
          - 6379:6379
        options: --entrypoint redis-server

    steps:
    - uses: actions/checkout@v7
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: 1.95.0
        components: llvm-tools-preview
    - name: Rust cache
      uses: Swatinem/rust-cache@v2
    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@v2.85.11
      with:
        tool: cargo-llvm-cov
    - name: Install PostgreSQL client
      run: sudo apt-get -yqq install postgresql-client

    - name: Run SQL file
      run: |
        export PGPASSWORD=password
        psql -h localhost -U user -d db -a -f etc/sql/config.sql
        psql -h localhost -U user -d db -a -f etc/sql/corporate_action.sql
        psql -h localhost -U user -d db -a -f etc/sql/daily_money_history.sql
        psql -h localhost -U user -d db -a -f etc/sql/daily_money_history_member.sql
        psql -h localhost -U user -d db -a -f etc/sql/daily_money_history_detail.sql
        psql -h localhost -U user -d db -a -f etc/sql/daily_money_history_detail_more.sql
        psql -h localhost -U user -d db -a -f etc/sql/daily_quote.sql
        psql -h localhost -U user -d db -a -f etc/sql/daily_stock_price_stats.sql
        psql -h localhost -U user -d db -a -f etc/sql/dividend.sql
        psql -h localhost -U user -d db -a -f etc/sql/dividend_record_detail.sql
        psql -h localhost -U user -d db -a -f etc/sql/dividend_record_detail_more.sql
        psql -h localhost -U user -d db -a -f etc/sql/estimate.sql
        psql -h localhost -U user -d db -a -f etc/sql/financial_statement.sql
        psql -h localhost -U user -d db -a -f etc/sql/index.sql
        psql -h localhost -U user -d db -a -f etc/sql/last_daily_quotes.sql
        psql -h localhost -U user -d db -a -f etc/sql/quote_history_record.sql
        psql -h localhost -U user -d db -a -f etc/sql/revenue.sql
        psql -h localhost -U user -d db -a -f etc/sql/revenue_last_date.sql
        psql -h localhost -U user -d db -a -f etc/sql/stock_cagr.sql
        psql -h localhost -U user -d db -a -f etc/sql/stock_exchange_market.sql
        psql -h localhost -U user -d db -a -f etc/sql/stock_industry.sql
        psql -h localhost -U user -d db -a -f etc/sql/stock_ownership_details.sql
        psql -h localhost -U user -d db -a -f etc/sql/stocks.sql
        psql -h localhost -U user -d db -a -f etc/sql/stock_word.sql
        psql -h localhost -U user -d db -a -f etc/sql/stock_index.sql
        psql -h localhost -U user -d db -a -f etc/sql/trace.sql
        psql -h localhost -U user -d db -a -f etc/sql/yield_rank.sql

    - name: Generate coverage report
      # coverage 也開 integration-tests feature：涵蓋率報告需要包含 DB/Redis
      # 相關程式碼的執行路徑，只跑單元測試會讓 infra 層涵蓋率嚴重失真。
      run: cargo llvm-cov --lcov --output-path lcov.info --features integration-tests -- --test-threads=1
      env:
        RUST_BACKTRACE: 1
        DATABASE_URL: postgres://user:password@localhost:5432/db
        POSTGRESQL_HOST: localhost
        POSTGRESQL_PORT: 5432
        POSTGRESQL_USER: user
        POSTGRESQL_PASSWORD: password
        POSTGRESQL_DB: db

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v7
      with:
        name: coverage-lcov
        path: lcov.info
        retention-days: 14

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: lcov.info
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}

