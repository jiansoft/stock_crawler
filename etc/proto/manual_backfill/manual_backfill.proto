syntax = "proto3";

package manual_backfill;

/// 手動資料回補服務，提供各類歷史資料補抓與 job 查詢介面。
service ManualBackfillService {
  rpc StartDailyQuotes(DailyQuotesRequest) returns (BackfillJobResponse) {}
  rpc StartClosingAggregate(ClosingAggregateRequest) returns (BackfillJobResponse) {}
  rpc StartTaiwanStockIndex(TaiwanStockIndexRequest) returns (BackfillJobResponse) {}
  rpc StartReceivedDividendRecords(SecurityCodeRequest) returns (BackfillJobResponse) {}
  rpc StartHistoricalDividends(SecurityCodeRequest) returns (BackfillJobResponse) {}
  rpc StartMultipleDividendHistoricalDividends(YearRequest) returns (BackfillJobResponse) {}
  rpc StartQuoteHistory(QuoteHistoryRequest) returns (BackfillJobResponse) {}
  rpc SaveCorporateAction(CorporateActionRequest) returns (CorporateActionResponse) {}
  rpc StartCagr(CagrRequest) returns (BackfillJobResponse) {}
  rpc StartCagrPeriod(CagrPeriodRequest) returns (BackfillJobResponse) {}
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {}
  rpc GetJob(GetJobRequest) returns (BackfillJobResponse) {}
}

message DailyQuotesRequest {
  string date = 1;
}

message ClosingAggregateRequest {
  string date = 1;
}

message TaiwanStockIndexRequest {
  string date = 1;
}

message SecurityCodeRequest {
  string security_code = 1;
}

message YearRequest {
  int32 year = 1;
}

message QuoteHistoryRequest {
  string stock_symbols = 1;
  string from = 2;
  string to = 3;
}

message CorporateActionRequest {
  string stock_symbol = 1;
  string effective_date = 2;
  string share_ratio = 3;
  string note = 4;
}

message CorporateActionItem {
  string effective_date = 1;
  string share_ratio = 2;
  string note = 3;
}

message CorporateActionResponse {
  string stock_symbol = 1;
  repeated CorporateActionItem actions = 2;
}

message CagrRequest {
  string date = 1;
}

message CagrPeriodRequest {
  string period = 1;
}

message ListJobsRequest {}

message GetJobRequest {
  string id = 1;
}

message BackfillJob {
  string id = 1;
  string kind = 2;
  string input = 3;
  string status = 4;
  string message = 5;
  string started_at = 6;
  string finished_at = 7;
}

message BackfillJobResponse {
  BackfillJob job = 1;
}

message ListJobsResponse {
  repeated BackfillJob jobs = 1;
}
