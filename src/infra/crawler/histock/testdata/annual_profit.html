  本 fixture 刻意涵蓋的情境：
  1. 頁面雜訊文字節點（導覽、標題）→ 不影響定位。
  2. 帶結尾連字號的年度「2025-」→ 應正規化為 2025。
  3. 總計欄的「--」→ EPS 應為 0 而非解析錯誤。
-->
